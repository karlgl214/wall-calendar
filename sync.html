<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101d2a">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>My Wall Calendar</title>
<script>
if(!localStorage.getItem("wallCalendarPinHash")||sessionStorage.getItem("wallCalendarUnlocked")!=="1"){
  window.location.replace("index.html");
}
</script>
<style>
:root{color-scheme:dark;--bg:#07111d;--panel:#10202e;--field:#091622;--line:#4b6275;--text:#fff;--muted:#aebbc7;--purple:#8b63e6;--green:#55d67a;--pink:#ff7db4}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg)}
iframe{border:0;width:100%;height:100%;display:block}
#syncModal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:999999;font-family:Arial,sans-serif;color:var(--text);padding:18px}
#syncModal.show{display:flex}
.box{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:22px;width:min(520px,94vw);max-height:calc(100vh - 36px);overflow:auto;box-shadow:0 15px 50px #0008}
.box h2{margin-top:0}.muted{color:var(--muted);line-height:1.4}.row{display:flex;gap:10px;align-items:center;margin:12px 0}.row>*{flex:1}
button,input{font:inherit}button{background:#1a2b3b;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-weight:700;cursor:pointer;transition:transform 160ms cubic-bezier(.23,1,.32,1)}button:active{transform:scale(.97)}
.primary{background:var(--purple);border-color:#b794ff}.code{font-size:34px;letter-spacing:8px;text-align:center;background:var(--field);border:1px solid #607a8f;border-radius:12px;padding:14px;margin:15px 0;font-weight:700}
label{display:block;margin-bottom:7px;font-weight:700}input{background:var(--field);border:1px solid #607a8f;color:var(--text);border-radius:9px;padding:11px;width:100%}
:focus-visible{outline:3px solid #ffd34d;outline-offset:3px}.status{min-height:24px;margin:10px 0;color:var(--green);line-height:1.4}.danger{color:var(--pink)}.small{font-size:13px}
[hidden]{display:none!important}
@media(max-width:520px){.row{flex-direction:column}.row>*{width:100%}.code{font-size:28px;letter-spacing:5px}}
</style>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
<iframe id="calendar" title="My Wall Calendar dashboard" src="wall-calendar-all-in-one-1.html"></iframe>
<div id="syncModal" role="dialog" aria-modal="true" aria-labelledby="syncTitle" aria-describedby="syncHelp">
  <div class="box">
    <h2 id="syncTitle">📱 Shared phone ↔ wall sync</h2>
    <p class="muted" id="syncHelp">Create a six-digit code on the wall, then enter it on your phone. Both devices must stay online while the transfer completes.</p>
    <div class="row">
      <button id="wallChoice" class="primary" type="button" onclick="startWall()">🖼️ This is the wall</button>
      <button id="phoneChoice" type="button" onclick="startPhone()">📱 This is my phone</button>
    </div>
    <div id="wallPanel" hidden>
      <p>Give this code to your phone:</p>
      <div id="wallCode" class="code" aria-live="polite">------</div>
      <button type="button" onclick="sendWallPhotos()">Send wall photos to phone</button>
    </div>
    <div id="phonePanel" hidden>
      <label for="phoneCode">Six-digit code shown on the wall</label>
      <input id="phoneCode" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="123456">
      <button class="primary" type="button" style="width:100%;margin-top:10px" onclick="connectPhone()">Connect to wall</button>
      <button type="button" style="width:100%;margin-top:8px" onclick="sendPhonePhotos()">Send my photos to wall</button>
    </div>
    <div id="syncStatus" class="status" role="status" aria-live="polite"></div>
    <button id="closeSyncButton" type="button" style="width:100%" onclick="closeSync()">Close</button>
    <p class="muted small">Photos stay in your browser unless you send them through this connection.</p>
  </div>
</div>
<script>
const frame=document.getElementById("calendar");
const syncModal=document.getElementById("syncModal");
const phoneCode=document.getElementById("phoneCode");
let peer=null,conn=null,role=null,lastFocus=null,connectionTimer=null;

function frameData(){try{return JSON.parse(localStorage.getItem("wallCalendarAllInOneV1")||"null")||{}}catch(error){return {}}}
function setFrameData(next){localStorage.setItem("wallCalendarAllInOneV1",JSON.stringify(next));try{frame.contentWindow.renderAll()}catch(error){}}
function setStatus(text,className=""){const element=document.getElementById("syncStatus");element.textContent=text;element.className="status "+className}
function panel(id,show){document.getElementById(id).hidden=!show}
function clearConnectionTimer(){if(connectionTimer){clearTimeout(connectionTimer);connectionTimer=null}}
function closePeer(){clearConnectionTimer();try{if(conn)conn.close()}catch(error){}try{if(peer)peer.destroy()}catch(error){}conn=null;peer=null}
function ensurePeerJs(){if(typeof Peer==="undefined"){setStatus("The sync service could not load. Check your internet connection and try again.","danger");return false}return true}
function createWallCode(){const values=new Uint32Array(1);crypto.getRandomValues(values);return String(100000+(values[0]%900000))}

function openSync(){
  lastFocus=frame.contentDocument?.activeElement||null;
  syncModal.classList.add("show");
  panel("wallPanel",false);panel("phonePanel",false);
  setStatus("Choose whether this device is the wall or your phone.");
  document.getElementById("wallChoice").focus();
}
function closeSync(){closePeer();syncModal.classList.remove("show");if(lastFocus&&typeof lastFocus.focus==="function")lastFocus.focus()}
function lockCalendar(){closePeer();sessionStorage.removeItem("wallCalendarUnlocked");window.location.replace("index.html")}

function startWall(){
  if(!ensurePeerJs())return;
  role="wall";closePeer();
  const wallCode=createWallCode();
  panel("wallPanel",true);panel("phonePanel",false);
  document.getElementById("wallCode").textContent=wallCode;
  setStatus("Preparing the wall connection…");
  peer=new Peer("wallcal-"+wallCode);
  peer.on("open",()=>setStatus("Wall is ready. Enter this code on your phone."));
  peer.on("connection",nextConnection=>{
    conn=nextConnection;
    conn.on("open",()=>{setStatus("Phone connected ✓");sendWallPhotos()});
    conn.on("data",handleData);
    conn.on("close",()=>setStatus("Phone disconnected.","danger"));
    conn.on("error",()=>setStatus("The phone connection failed. Please try again.","danger"));
  });
  peer.on("error",()=>setStatus("Could not start this code. Tap “This is the wall” again.","danger"));
}

function startPhone(){
  if(!ensurePeerJs())return;
  role="phone";closePeer();panel("wallPanel",false);panel("phonePanel",true);
  setStatus("Enter the code from the wall.");phoneCode.focus();
}

function connectPhone(){
  if(!ensurePeerJs())return;
  const code=phoneCode.value.replace(/\D/g,"").slice(0,6);phoneCode.value=code;
  if(code.length!==6){setStatus("Please enter all 6 digits.","danger");phoneCode.focus();return}
  closePeer();setStatus("Connecting…");peer=new Peer();
  connectionTimer=setTimeout(()=>{setStatus("Connection timed out. Check the code and try again.","danger");closePeer()},12000);
  peer.on("open",()=>{
    conn=peer.connect("wallcal-"+code,{reliable:true});
    conn.on("open",()=>{clearConnectionTimer();setStatus("Connected to wall ✓");sendPhonePhotos()});
    conn.on("data",handleData);
    conn.on("close",()=>setStatus("Connection closed.","danger"));
    conn.on("error",()=>{clearConnectionTimer();setStatus("Could not connect. Check the code and try again.","danger")});
  });
  peer.on("error",()=>{clearConnectionTimer();setStatus("Could not connect. Check the code and try again.","danger")});
}

function handleData(message){
  if(!message||!message.type)return;
  if(message.type==="photos"){
    const next=frameData();next.photos=Array.isArray(message.photos)?message.photos:[];setFrameData(next);setStatus("Photos received ✓");
  }else if(message.type==="photo"){
    const next=frameData();next.photos=next.photos||[];if(!next.photos.includes(message.photo))next.photos.push(message.photo);setFrameData(next);setStatus("Photo received ✓");
  }else if(message.type==="requestPhotos"&&role==="wall")sendWallPhotos();
}
function sendWallPhotos(){if(!conn||!conn.open){setStatus("Connect your phone first.","danger");return}const next=frameData();conn.send({type:"photos",photos:next.photos||[]});setStatus("Wall photos sent ✓")}
function sendPhonePhotos(){if(!conn||!conn.open){setStatus("Connect to the wall first.","danger");return}const photos=frameData().photos||[];if(!photos.length){setStatus("There are no photos on this phone yet.","danger");return}conn.send({type:"photos",photos});setStatus("Photos sent to wall ✓")}

phoneCode.addEventListener("input",()=>{phoneCode.value=phoneCode.value.replace(/\D/g,"").slice(0,6)});
phoneCode.addEventListener("keydown",event=>{if(event.key==="Enter")connectPhone()});
syncModal.addEventListener("mousedown",event=>{if(event.target===syncModal)closeSync()});
document.addEventListener("keydown",event=>{if(event.key==="Escape"&&syncModal.classList.contains("show"))closeSync()});
window.addEventListener("pagehide",closePeer);
</script>
</body>
</html>
