<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101d2a">
<title>My Wall Calendar</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111d}
iframe{border:0;width:100%;height:100%;display:block}
#syncModal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:999999;font-family:Arial,sans-serif;color:#fff;padding:18px}
#syncModal.show{display:flex}
.box{background:#10202e;border:1px solid #4b6275;border-radius:17px;padding:22px;width:min(520px,94vw);box-shadow:0 15px 50px #0008}
.box h2{margin-top:0}.muted{color:#aebbc7}.row{display:flex;gap:10px;align-items:center;margin:12px 0}.row>*{flex:1}
button,input{font:inherit}button{background:#1a2b3b;color:#fff;border:1px solid #4b6275;border-radius:10px;padding:11px 13px;font-weight:700;cursor:pointer}
.primary{background:#7650d6;border-color:#9b6cff}.code{font-size:34px;letter-spacing:8px;text-align:center;background:#091622;border:1px solid #486073;border-radius:12px;padding:14px;margin:15px 0;font-weight:700}
input{background:#091622;border:1px solid #486073;color:#fff;border-radius:9px;padding:11px;width:100%;box-sizing:border-box}
.status{min-height:24px;margin:10px 0;color:#55d67a}.danger{color:#ff5fa2}.small{font-size:13px}
</style>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
<iframe id="calendar" src="wall-calendar-all-in-one-1.html"></iframe>
<div id="syncModal">
<div class="box">
<h2>📱 Shared phone ↔ wall sync</h2>
<p class="muted">Use the wall to create a 6-digit code, then enter that code on your phone.</p>
<div class="row">
<button class="primary" onclick="startWall()">🖼️ This is the wall</button>
<button onclick="startPhone()">📱 This is my phone</button>
</div>
<div id="wallPanel" style="display:none">
<p>Give this code to your phone:</p>
<div id="wallCode" class="code">------</div>
<button onclick="sendWallPhotos()">Send wall photos to phone</button>
</div>
<div id="phonePanel" style="display:none">
<p>Enter the 6-digit code shown on the wall:</p>
<input id="phoneCode" inputmode="numeric" maxlength="6" placeholder="123456">
<button class="primary" style="width:100%;margin-top:10px" onclick="connectPhone()">Connect to wall</button>
<button style="width:100%;margin-top:8px" onclick="sendPhonePhotos()">Send my photos to wall</button>
</div>
<div id="syncStatus" class="status"></div>
<button style="width:100%" onclick="closeSync()">Close</button>
<p class="muted small">Photos stay in your browser unless you send them through this connection.</p>
</div>
</div>
<script>
const frame=document.getElementById('calendar');
let peer=null,conn=null,role=null,wallCode=null;
function frameData(){try{return JSON.parse(localStorage.getItem('wallCalendarAllInOneV1')||'null')||{}}catch(e){return {}}}
function setFrameData(d){localStorage.setItem('wallCalendarAllInOneV1',JSON.stringify(d));try{frame.contentWindow.renderAll()}catch(e){}}
function openSync(){document.getElementById('syncModal').classList.add('show');setStatus('Choose whether this device is the wall or your phone.','')}
function closeSync(){document.getElementById('syncModal').classList.remove('show')}
function setStatus(t,c){let e=document.getElementById('syncStatus');e.textContent=t;e.className='status '+(c||'')}
function closePeer(){try{if(conn)conn.close()}catch(e){}try{if(peer)peer.destroy()}catch(e){}conn=null;peer=null}
function ensurePeerJs(){if(typeof Peer==='undefined'){setStatus('Sync library is still loading. Try again in a moment.','danger');return false}return true}
function startWall(){if(!ensurePeerJs())return;role='wall';closePeer();wallCode=String(Math.floor(100000+Math.random()*900000));peer=new Peer('wallcal-'+wallCode);document.getElementById('wallPanel').style.display='block';document.getElementById('phonePanel').style.display='none';document.getElementById('wallCode').textContent=wallCode;setStatus('Waiting for your phone to connect…','');peer.on('open',()=>setStatus('Wall is ready. Enter this code on your phone.',''));peer.on('connection',c=>{conn=c;conn.on('open',()=>{setStatus('Phone connected ✓','');sendWallPhotos()});conn.on('data',handleData);conn.on('close',()=>setStatus('Phone disconnected.','danger'))});peer.on('error',()=>setStatus('Could not start this code. Tap “This is the wall” again.','danger'))}
function startPhone(){if(!ensurePeerJs())return;role='phone';closePeer();document.getElementById('wallPanel').style.display='none';document.getElementById('phonePanel').style.display='block';setStatus('Enter the code from the wall.','')}
function connectPhone(){if(!ensurePeerJs())return;let code=document.getElementById('phoneCode').value.replace(/\D/g,'').slice(0,6);if(code.length!==6){setStatus('Please enter all 6 digits.','danger');return}closePeer();peer=new Peer();peer.on('open',()=>{conn=peer.connect('wallcal-'+code,{reliable:true});conn.on('open',()=>{setStatus('Connected to wall ✓','');sendPhonePhotos()});conn.on('data',handleData);conn.on('close',()=>setStatus('Connection closed.','danger'));conn.on('error',()=>setStatus('Could not connect. Check the code and try again.','danger'))});peer.on('error',()=>setStatus('Could not connect. Check the code and try again.','danger'));setStatus('Connecting…','')}
function handleData(msg){if(!msg||!msg.type)return;if(msg.type==='photos'){let d=frameData();d.photos=Array.isArray(msg.photos)?msg.photos:[];setFrameData(d);setStatus('Photos received ✓','')}else if(msg.type==='photo'){let d=frameData();d.photos=d.photos||[];if(!d.photos.includes(msg.photo))d.photos.push(msg.photo);setFrameData(d);setStatus('Photo received ✓','')}else if(msg.type==='requestPhotos'){if(role==='wall')sendWallPhotos()}}
function sendWallPhotos(){if(!conn||!conn.open){setStatus('Connect your phone first.','danger');return}let d=frameData();conn.send({type:'photos',photos:d.photos||[]});setStatus('Wall photos sent ✓','')}
function sendPhonePhotos(){if(!conn||!conn.open){setStatus('Connect to the wall first.','danger');return}let d=frameData();let photos=d.photos||[];if(!photos.length){setStatus('There are no photos on this phone yet.','danger');return}setStatus('Sending '+photos.length+' photo(s)…','');conn.send({type:'photos',photos:photos});setStatus('Photos sent to wall ✓','')}
function injectSyncButton(){try{let doc=frame.contentDocument;let spans=[...doc.querySelectorAll('.setting span')];let label=spans.find(s=>s.textContent.includes('Shared phone'));if(!label)return;let row=label.parentElement,old=row.lastElementChild;if(old&&old.dataset.syncReplaced)return;let b=doc.createElement('button');b.textContent='Set up';b.style.background='#7650d6';b.style.borderColor='#9b6cff';b.onclick=openSync;b.dataset.syncReplaced='1';row.replaceChild(b,old)}catch(e){}}
frame.addEventListener('load',()=>{setTimeout(injectSyncButton,250);setTimeout(injectSyncButton,1000)});
</script>
</body>
</html>
